name: Android Instrumented Tests

on:
  push:
    branches:
      - main

jobs:
  instrumentation-tests:
    name: Run Android instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-snapshot-load -no-snapshot-save -no-boot-anim -wipe-data
          script: echo "emulator started"

      - name: Ensure ADB is healthy and wait for device to be fully booted
        run: |
          set -euxo pipefail

          # Restart adb to recover from transient "device offline" states
          adb kill-server || true
          adb start-server || true

          EMULATOR_SERIAL="emulator-5554"

          echo "Waiting for emulator to show up in adb devices (up to 5 minutes)..."
          FOUND=false
          for i in $(seq 1 60); do
            adb devices || true
            if adb devices | awk '{print $1,$2}' | grep -w "${EMULATOR_SERIAL} device" >/dev/null 2>&1; then
              FOUND=true
              echo "Emulator ${EMULATOR_SERIAL} is in 'device' state"
              break
            fi
            # If it appears as 'offline' try reconnecting and restarting adb
            if adb devices | grep -w "${EMULATOR_SERIAL} offline" >/dev/null 2>&1; then
              echo "Emulator reported as offline, trying to reconnect..."
              adb -s ${EMULATOR_SERIAL} reconnect || true
              adb kill-server || true
              adb start-server || true
            fi
            sleep 5
          done

          if [ "${FOUND}" != "true" ]; then
            echo "Emulator did not appear as a device in time. Dumping adb devices and emulator logcat for debugging..."
            adb devices || true
            adb -s ${EMULATOR_SERIAL} logcat -d || true
            exit 1
          fi

          echo "Waiting for Android system to finish booting (sys.boot_completed = 1) (up to 5 minutes)..."
          BOOTED=false
          for i in $(seq 1 60); do
            BOOT_PROP=$(adb -s ${EMULATOR_SERIAL} shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            echo "sys.boot_completed=${BOOT_PROP}"
            if [ "${BOOT_PROP}" = "1" ]; then
              BOOTED=true
              break
            fi
            sleep 5
          done

          if [ "${BOOTED}" != "true" ]; then
            echo "Device did not finish booting in time. Dumping logcat..."
            adb -s ${EMULATOR_SERIAL} logcat -d || true
            exit 1
          fi

          # Optional: wait for package manager to be responsive
          for i in $(seq 1 20); do
            if adb -s ${EMULATOR_SERIAL} shell pm path android >/dev/null 2>&1; then
              echo "Package manager responsive"
              break
            fi
            sleep 2
          done

      - name: Run instrumentation tests
        run: ./gradlew connectedAndroidTest --no-daemon -Porg.gradle.jvmargs="-Xmx3g"

      - name: Upload test results (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-results
          path: app/build/reports/androidTests